<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">揭曉：姓名顯示在得獎飯糰中央</title><desc id="desc">四顆飯糰在畫面中央穩定停留，範例姓名後置於各自飯糰的米白正面區域，不使用浮動姓名牌。</desc><defs><radialGradient id="spot"><stop stop-color="#fffdf5" stop-opacity=".9"/><stop offset="1" stop-color="#fffdf5" stop-opacity="0"/></radialGradient><style>.winner-name{font:800 15px "Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#59402b;text-anchor:middle;paint-order:stroke;stroke:#fff6e5;stroke-width:4px;stroke-linejoin:round}</style></defs><image href="stage-base.svg" width="1920" height="1080"/><image href="../../img/onigiri-shelf.svg" x="480" y="390" width="960" height="416" opacity=".5"/><ellipse cx="960" cy="666" rx="640" ry="320" fill="url(#spot)"/><ellipse cx="960" cy="809" rx="500" ry="28" fill="#734d31" opacity=".15"/><g><image href="../../img/onigiri.svg" x="595" y="563" width="170" height="177"/><image href="../../img/onigiri.svg" x="790" y="535" width="190" height="198"/><image href="../../img/onigiri.svg" x="1000" y="535" width="190" height="198"/><image href="../../img/onigiri.svg" x="1210" y="563" width="170" height="177"/></g><g class="winner-name"><text x="680" y="651">得獎者 1</text><text x="885" y="624">得獎者 2</text><text x="1095" y="624">得獎者 3</text><text x="1295" y="651">得獎者 4</text></g></svg>